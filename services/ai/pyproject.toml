[project]
name = "hunarpramaan-ai"
version = "0.1.0"
description = "HunarPramaan AI service: assessment aids that only suggest (safety gear and workmanship checks on evidence frames)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
    "av>=14.0",
    "fastapi>=0.115",
    "numpy>=2.1",
    "pillow>=11.0",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# The zero-shot detector (ADR 012). Heavy: about 1 GB with the CPU build of PyTorch,
# plus a 620 MB model download on first use. CI and the unit tests run without it.
detector = [
    "scipy>=1.14",
    "torch>=2.5",
    "transformers>=4.48",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hunarpramaan_ai"]

# CPU-only PyTorch on Linux and Windows: the default Linux wheels bring 2 GB of CUDA.
# macOS wheels on PyPI are already CPU (and Apple GPU) builds.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# The docs use typographic dashes ("30–60 s"), as the rest of the repository does.
ignore = ["RUF001", "RUF002", "RUF003"]
