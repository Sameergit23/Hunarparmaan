<!doctype html>
<!-- Wire code reference screen: a static mock-up. Rules in ../wire-code.md, values in ../tokens.json. Names, places and numbers are made up. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scoring: one criterion | HunarPramaan, Wire code reference</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&amp;family=Hind:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #000000;outline-offset:2px}
a{color:#000000}a:hover{color:#2E7D32}
</style>
<style>html{background:#D2D4CE}body{display:flex;justify-content:center;padding:24px 0}body>div{outline:1.5px solid #8E918A}</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #E4E5E0; color: #000000; font-family: 'Hind', 'Noto Sans Devanagari', sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" style="display: grid; grid-template-rows: repeat(3, 4px)">
<span style="background: #C8102E"></span>
<span style="background: #F2B600"></span>
<span style="background: #1F4E9C"></span>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px 18px">
<div style="display: flex; align-items: center; gap: 12px">
<a href="#" aria-label="Back" style="width: 44px; height: 44px; flex: none; border-radius: 6px; border: 2px solid #000000; background: #FAFAF7; color: #000000; display: flex; align-items: center; justify-content: center; box-sizing: border-box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><line x1="19" y1="12" x2="6" y2="12"></line><polyline points="12 18 6 12 12 6"></polyline></svg></a>
<div style="display: flex; flex-direction: column"><h1 style="margin: 0; font-family: 'Rajdhani', 'Hind', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.1">Earthing, PC4</h1><span style="font-size: 14px; color: #4A4C47">Ramesh Kumar, clip 2 of 4</span></div>
</div>
<div style="position: relative; height: 168px; border-radius: 6px; background: #000000; display: flex; align-items: center; justify-content: center">
<button type="button" aria-label="Play clip" style="width: 56px; height: 56px; border-radius: 28px; border: 0; background: #FAFAF7; color: #000000; display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><polygon points="8 5 19 12 8 19 8 5"></polygon></svg></button>
<div style="position: absolute; left: 10px; bottom: 10px; display: flex; gap: 6px">
<span style="padding: 2px 8px; border-radius: 4px; background: #FAFAF7; color: #000000; font-size: 13px; font-weight: 600">0:42</span>
<span style="padding: 2px 8px; border-radius: 4px; background: #2E7D32; color: #FFFFFF; font-size: 13px; font-weight: 600">GPS checked</span>
<span style="padding: 2px 8px; border-radius: 4px; background: #2E7D32; color: #FFFFFF; font-size: 13px; font-weight: 600">Hash checked</span>
</div>
</div>
<div style="display: flex; align-items: flex-start; gap: 10px; background: #F2B600; border: 2px solid #000000; border-radius: 6px; padding: 10px 12px">
<span aria-hidden="true" style="width: 12px; height: 12px; flex: none; margin-top: 5px; border-radius: 6px; border: 2px solid #000000; background: #E4E5E0"></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">AI hint: gloves not seen, 82% sure</span><span style="font-size: 14px">A hint only. Your score decides.</span></span>
</div>
<fieldset style="border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
<legend style="padding: 0; margin: 0 0 8px; display: flex; flex-direction: column"><span style="font-family: 'Rajdhani', 'Hind', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1">Your score</span><span style="font-size: 14px; color: #4A4C47">Measure earth resistance and leakage</span></legend>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<label style="height: 104px; box-sizing: border-box; border: 2px solid #000000; border-radius: 6px; background: #FAFAF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer">
<input type="radio" name="score" value="0" style="width: 18px; height: 18px; margin: 0; accent-color: #000000">
<span style="font-family: 'Rajdhani', 'Hind', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">0</span>
<span style="font-size: 13px; font-weight: 600">Can't do it</span>
</label>
<label style="height: 104px; box-sizing: border-box; border: 2px solid #000000; border-radius: 6px; background: #FAFAF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer">
<input type="radio" name="score" value="1" style="width: 18px; height: 18px; margin: 0; accent-color: #000000">
<span style="font-family: 'Rajdhani', 'Hind', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">1</span>
<span style="font-size: 13px; font-weight: 600">Partly</span>
</label>
<label style="height: 104px; box-sizing: border-box; border: 2px solid #000000; border-radius: 6px; background: #000000; color: #FAFAF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer">
<input type="radio" name="score" value="2" checked style="width: 18px; height: 18px; margin: 0; accent-color: #FAFAF7">
<span style="font-family: 'Rajdhani', 'Hind', sans-serif; font-size: 40px; font-weight: 700; line-height: 1">2</span>
<span style="font-size: 13px; font-weight: 600">Correct, safe</span>
</label>
</div>
<p style="margin: 0; background: #FAFAF7; border: 1.5px solid #8E918A; border-radius: 6px; padding: 10px 12px; font-size: 15px; line-height: 1.4">2 means: takes a correct reading safely and judges it against the limit.</p>
</fieldset>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="reason-a" style="font-size: 14px; font-weight: 600">Your score differs from the AI hint. Say why.</label>
<input id="reason-a" type="text" value="Gloves worn; hands out of frame at the pit" style="height: 46px; box-sizing: border-box; width: 100%; border: 2px solid #000000; border-radius: 6px; padding: 0 12px; font: inherit; font-size: 16px; background: #FAFAF7; color: #000000">
</div>
<div style="flex: 1"></div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 54px; border-radius: 6px; border: 2px solid #000000; background: #FAFAF7; color: #000000; font-size: 17px; font-weight: 600">Re-record</button>
<button type="button" style="height: 54px; border-radius: 6px; border: 2px solid #000000; background: #000000; color: #FAFAF7; font-size: 17px; font-weight: 600">Save score</button>
</div>
</div>
</div>
</body>
</html>
