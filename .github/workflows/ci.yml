name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # The team develops on Windows, macOS and Linux, on Node 22 or 24 (package.json engines).
    name: Lint, typecheck and test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 22 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # version comes from packageManager in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Validate and package the trade packs
        run: pnpm pack:build electrician
      - name: Dependency audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: pnpm audit --audit-level high

  api-postgres:
    name: API tests on PostgreSQL 17
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17
        env:
          POSTGRES_USER: hp
          POSTGRES_PASSWORD: hp
          POSTGRES_DB: hp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hp -d hp_test"
          --health-interval 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration tests against real PostgreSQL (the main job uses PGlite)
        run: pnpm --filter @hunarpramaan/api test
        env:
          TEST_DATABASE_URL: postgres://hp:hp@localhost:5432/hp_test

  e2e-web:
    name: Web end-to-end (Playwright)
    runs-on: ubuntu-latest
    env:
      # Throwaway values for this job only; the database is in-process PGlite.
      JWT_SECRET: ci-${{ github.run_id }}-${{ github.run_attempt }}-throwaway-signing-key
      MOCK_INTEGRATIONS: 'true'
      API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Seed the demo pilot
        run: pnpm db:seed
      - name: Build the API and the web app
        run: pnpm build
      - name: Start both
        run: |
          (cd services/api && node dist/server.js > ../../api.log 2>&1 &)
          (cd apps/web && pnpm start > ../../web.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:4000/healthz && curl -sf -o /dev/null localhost:3000 && exit 0; sleep 2; done
          cat api.log web.log; exit 1
      - run: pnpm --filter @hunarpramaan/web exec playwright install --with-deps chromium
      - run: pnpm e2e:web
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            apps/web/test-results
            api.log
            web.log

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
